version: '3.8'

services:
  ujiscan:
    image: ujiscan:comprehensive
    container_name: ujiscan
    restart: unless-stopped
    
    # SECURITY: Run as non-root user
    user: "1000:1000"
    
    # SECURITY: No new privileges
    security_opt:
      - no-new-privileges:true
    
    # SECURITY: Read-only root filesystem
    read_only: true
    
    # Port mapping (localhost only)
    ports:
      - "127.0.0.1:8081:8081"
    
    # PERSISTENCE - Docker volumes (tidak hilang restart)
    volumes:
      - ujiscan-data:/app/data:rw
      - ujiscan-logs:/app/logs:rw
      - /tmp:/tmp:rw
    
    # Environment variables
    environment:
      - DATABASE_PATH=/app/data/ujiscan.db
      - LOG_LEVEL=info
    
    # SECURITY: Secrets dari .env file
    env_file:
      - .env
    
    # SECURITY: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # SECURITY: Isolated network
    networks:
      - ujiscan-net
    
    # SECURITY: Logging limits
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ujiscan-net:
    driver: bridge

volumes:
  ujiscan-data:
    driver: local
  ujiscan-logs:
    driver: local
