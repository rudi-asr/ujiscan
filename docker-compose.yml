version: '3.8'

services:
  ujiscan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ujiscan
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=info
      - CORS_ALLOWED_ORIGINS=http://localhost:8081,http://localhost:3000,https://rudi-asr.github.io
      - DATABASE_PATH=/app/data/ujiscan.db
    volumes:
      - ujiscan_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ujiscan_data:
    driver: local
