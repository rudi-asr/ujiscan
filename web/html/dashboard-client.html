<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ujiscan - Client Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e27;
            --fg: #e0e0e0;
            --bg-secondary: #1a1f3a;
            --border: #333;
            --accent: #00d4ff;
            --success: #00ff88;
            --error: #ff3333;
            --critical: #ff1744;
            --high: #ff5722;
            --medium: #ffc107;
            --low: #4caf50;
        }

        html[data-theme="dark"] {
            --bg: #0a0e27;
            --fg: #e0e0e0;
            --bg-secondary: #1a1f3a;
            --border: #333;
            --accent: #00d4ff;
        }

        html[data-theme="light"] {
            --bg: #ffffff;
            --fg: #000000;
            --bg-secondary: #f5f5f5;
            --border: #cccccc;
            --accent: #0066ff;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .navbar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
        }

        .navbar-title {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent);
            margin: 0;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-badge {
            background-color: var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .logout-btn {
            background-color: var(--error);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: #cc0000;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            color: var(--fg);
        }

        .theme-toggle:hover {
            color: var(--accent);
        }

        .container-dashboard {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 2rem;
            color: var(--fg);
        }

        .risk-overview {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .risk-score {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .risk-score.critical {
            color: var(--critical);
        }

        .risk-score.high {
            color: var(--high);
        }

        .risk-score.medium {
            color: var(--medium);
        }

        .risk-score.low {
            color: var(--low);
        }

        .risk-label {
            font-size: 1.5em;
            margin-bottom: 1rem;
        }

        .risk-description {
            color: #999;
            margin-bottom: 1rem;
        }

        .findings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .finding-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            border-left: 4px solid var(--low);
        }

        .finding-card.critical {
            border-left-color: var(--critical);
        }

        .finding-card.high {
            border-left-color: var(--high);
        }

        .finding-card.medium {
            border-left-color: var(--medium);
        }

        .finding-card h3 {
            margin: 0 0 0.5rem 0;
            color: var(--fg);
            font-size: 1.1em;
        }

        .finding-severity {
            display: inline-block;
            padding: 0.3rem 0.7rem;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .finding-severity.critical {
            background-color: rgba(255, 23, 68, 0.2);
            color: var(--critical);
        }

        .finding-severity.high {
            background-color: rgba(255, 87, 34, 0.2);
            color: var(--high);
        }

        .finding-severity.medium {
            background-color: rgba(255, 193, 7, 0.2);
            color: var(--medium);
        }

        .finding-severity.low {
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--low);
        }

        .finding-description {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 1rem;
        }

        .finding-remediation {
            background-color: rgba(0, 212, 255, 0.05);
            border-left: 3px solid var(--accent);
            padding: 0.8rem;
            border-radius: 4px;
            font-size: 0.85em;
            color: #aaa;
        }

        .recommendations-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .recommendations-section h2 {
            margin-bottom: 1rem;
            color: var(--fg);
        }

        .recommendation-item {
            padding: 1rem;
            border-left: 3px solid var(--accent);
            background-color: rgba(0, 212, 255, 0.05);
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .recommendation-item strong {
            color: var(--accent);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .engagement-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .engagement-tab {
            padding: 1rem;
            border: none;
            background: none;
            color: #999;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .engagement-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div>
                <h1 class="navbar-title">☠️ ujiscan</h1>
            </div>
            <div class="navbar-user">
                <span class="user-badge" id="userBadge">Loading...</span>
                <button class="theme-toggle" onclick="theme.toggle()" title="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
                <button class="logout-btn" onclick="auth.logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-dashboard">
        <h2 class="page-title">Client Dashboard</h2>

        <!-- Engagement Selection -->
        <div class="engagement-tabs" id="engagementTabs">
            <button class="engagement-tab active" onclick="selectEngagement(null)">All Findings</button>
        </div>

        <!-- Risk Overview -->
        <div class="risk-overview" id="riskOverview">
            <div class="risk-label">Overall Risk Score</div>
            <div class="risk-score low" id="riskScore">-</div>
            <div class="risk-label" id="riskLabel">Low Risk</div>
            <div class="risk-description" id="riskDescription">No critical issues found</div>
        </div>

        <!-- Critical Findings -->
        <div id="criticalFindings"></div>

        <!-- High Findings -->
        <div id="highFindings"></div>

        <!-- Medium Findings -->
        <div id="mediumFindings"></div>

        <!-- Low Findings -->
        <div id="lowFindings"></div>

        <!-- Recommendations -->
        <div class="recommendations-section" id="recommendationsSection">
            <h2>🎯 Recommended Actions</h2>
            <div id="recommendations"></div>
        </div>
    </div>

    <script src="../app.js"></script>
    <script>
        // Page initialization
        async function initPage() {
            updateThemeIcon();
            const observer = new MutationObserver(updateThemeIcon);
            observer.observe(document.documentElement, { attributes: true });

            // Load user info
            try {
                const user = auth.getUser();
                if (user) {
                    document.getElementById('userBadge').textContent = `${user.email} (${user.role})`;
                }
            } catch (err) {
                console.error('Error loading user:', err);
            }

            // Load dashboard data
            await loadDashboard();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            icon.textContent = theme.current() === 'dark' ? '☀️' : '🌙';
        }

        async function loadDashboard() {
            try {
                // Load client dashboard data
                const dashData = await api.getDashboardClient();
                
                // Update risk score
                updateRiskScore(dashData.riskScore || 0);

                // Load engagements for tabs
                const engData = await api.listEngagements();
                loadEngagementTabs(engData);

                // Load findings by severity
                loadFindingsBySeverity(dashData);

                // Load recommendations
                loadRecommendations(dashData);
            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        }

        function updateRiskScore(score) {
            let level = 'low';
            let label = 'Low Risk';
            let description = 'No critical issues found';

            if (score >= 90) {
                level = 'critical';
                label = 'Critical Risk';
                description = 'Immediate remediation required';
            } else if (score >= 70) {
                level = 'high';
                label = 'High Risk';
                description = 'Urgent attention needed';
            } else if (score >= 40) {
                level = 'medium';
                label = 'Medium Risk';
                description = 'Review and address findings';
            }

            document.getElementById('riskScore').textContent = score;
            document.getElementById('riskScore').className = `risk-score ${level}`;
            document.getElementById('riskLabel').textContent = label;
            document.getElementById('riskDescription').textContent = description;
        }

        function loadEngagementTabs(data) {
            if (!data.engagements || data.engagements.length === 0) return;

            const tabs = document.getElementById('engagementTabs');
            data.engagements.forEach(eng => {
                const tab = document.createElement('button');
                tab.className = 'engagement-tab';
                tab.textContent = eng.name || eng.id;
                tab.onclick = () => selectEngagement(eng.id);
                tabs.appendChild(tab);
            });
        }

        function selectEngagement(id) {
            // Update active tab
            document.querySelectorAll('.engagement-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function loadFindingsBySeverity(data) {
            const severities = ['critical', 'high', 'medium', 'low'];
            const findings = data.findings || [];

            severities.forEach(severity => {
                const severityFindings = findings.filter(f => f.severity === severity);
                const container = document.getElementById(`${severity}Findings`);

                if (severityFindings.length === 0) {
                    container.innerHTML = '';
                    return;
                }

                let html = `<div style="margin-bottom: 2rem;">
                    <h3 style="margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; color: #999;">
                        ${severity} Severity Issues (${severityFindings.length})
                    </h3>
                    <div class="findings-grid">`;

                severityFindings.forEach(finding => {
                    html += `
                        <div class="finding-card ${severity}">
                            <h3>${finding.name || 'Unknown Finding'}</h3>
                            <span class="finding-severity ${severity}">${severity.toUpperCase()}</span>
                            <div class="finding-description">
                                ${finding.description || 'No description'}
                            </div>
                            <div class="finding-remediation">
                                <strong>Remediation:</strong><br>
                                ${finding.remediation || 'Contact your security team for more details'}
                            </div>
                        </div>
                    `;
                });

                html += '</div></div>';
                container.innerHTML = html;
            });
        }

        function loadRecommendations(data) {
            const recommendations = data.recommendations || [];

            if (recommendations.length === 0) {
                document.getElementById('recommendations').innerHTML = `
                    <p style="color: #999;">All recommended actions have been completed!</p>
                `;
                return;
            }

            const html = recommendations.map(rec => `
                <div class="recommendation-item">
                    <strong>${rec.priority || 'Action'}:</strong> ${rec.description || 'No details'}
                </div>
            `).join('');

            document.getElementById('recommendations').innerHTML = html;
        }

        // Initialize on page load
        if (auth.isLoggedIn()) {
            initPage();
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
