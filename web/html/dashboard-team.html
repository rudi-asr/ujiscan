<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ujiscan - Team Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e27;
            --fg: #e0e0e0;
            --bg-secondary: #1a1f3a;
            --border: #333;
            --accent: #00d4ff;
            --success: #00ff88;
            --error: #ff3333;
            --high: #ff5722;
            --medium: #ffc107;
            --low: #4caf50;
        }

        html[data-theme="dark"] {
            --bg: #0a0e27;
            --fg: #e0e0e0;
            --bg-secondary: #1a1f3a;
            --border: #333;
            --accent: #00d4ff;
        }

        html[data-theme="light"] {
            --bg: #ffffff;
            --fg: #000000;
            --bg-secondary: #f5f5f5;
            --border: #cccccc;
            --accent: #0066ff;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .navbar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
        }

        .navbar-title {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent);
            margin: 0;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-badge {
            background-color: var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .logout-btn {
            background-color: var(--error);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: #cc0000;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            color: var(--fg);
        }

        .theme-toggle:hover {
            color: var(--accent);
        }

        .container-dashboard {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 2rem;
            color: var(--fg);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .metric-card h3 {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--accent);
        }

        .metric-card.high .metric-value {
            color: var(--high);
        }

        .metric-card.medium .metric-value {
            color: var(--medium);
        }

        .metric-card.success .metric-value {
            color: var(--success);
        }

        .activity-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .activity-section h2 {
            font-size: 1.3em;
            margin-bottom: 1rem;
            color: var(--fg);
        }

        .activity-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-text {
            flex: 1;
        }

        .activity-text strong {
            color: var(--accent);
        }

        .activity-time {
            color: #999;
            font-size: 0.9em;
            white-space: nowrap;
            margin-left: 1rem;
        }

        .severity-badge {
            display: inline-block;
            padding: 0.3rem 0.7rem;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .severity-badge.critical {
            background-color: rgba(255, 23, 68, 0.2);
            color: #ff1744;
        }

        .severity-badge.high {
            background-color: rgba(255, 87, 34, 0.2);
            color: var(--high);
        }

        .severity-badge.medium {
            background-color: rgba(255, 193, 7, 0.2);
            color: var(--medium);
        }

        .severity-badge.low {
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--low);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div>
                <h1 class="navbar-title">☠️ ujiscan</h1>
            </div>
            <div class="navbar-user">
                <span class="user-badge" id="userBadge">Loading...</span>
                <button class="theme-toggle" onclick="theme.toggle()" title="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
                <button class="logout-btn" onclick="auth.logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-dashboard">
        <h2 class="page-title">Team Dashboard</h2>

        <!-- Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Total Engagements</h3>
                <div class="metric-value" id="metric-engagements">-</div>
            </div>
            <div class="metric-card">
                <h3>Active Scans</h3>
                <div class="metric-value" id="metric-scans">-</div>
            </div>
            <div class="metric-card high">
                <h3>Critical Findings</h3>
                <div class="metric-value" id="metric-critical">-</div>
            </div>
            <div class="metric-card medium">
                <h3>High Findings</h3>
                <div class="metric-value" id="metric-high">-</div>
            </div>
            <div class="metric-card success">
                <h3>Resolved</h3>
                <div class="metric-value" id="metric-resolved">-</div>
            </div>
        </div>

        <!-- Activity Feed -->
        <div class="activity-section">
            <h2>Recent Activity</h2>
            <div id="activityFeed" class="loading">
                <div class="spinner"></div>
                <p>Loading activity...</p>
            </div>
        </div>

        <!-- Engagements List -->
        <div class="activity-section">
            <h2>Team Engagements</h2>
            <div id="engagementsList" class="loading">
                <div class="spinner"></div>
                <p>Loading engagements...</p>
            </div>
        </div>
    </div>

    <script src="../app.js"></script>
    <script>
        // Page initialization
        async function initPage() {
            updateThemeIcon();
            const observer = new MutationObserver(updateThemeIcon);
            observer.observe(document.documentElement, { attributes: true });

            // Load user info
            try {
                const user = auth.getUser();
                if (user) {
                    document.getElementById('userBadge').textContent = `${user.email} (${user.role})`;
                }
            } catch (err) {
                console.error('Error loading user:', err);
            }

            // Load dashboard data
            await loadDashboard();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            icon.textContent = theme.current() === 'dark' ? '☀️' : '🌙';
        }

        async function loadDashboard() {
            try {
                // Load team dashboard data
                const dashData = await api.getDashboardTeam();
                
                // Update metrics
                document.getElementById('metric-engagements').textContent = dashData.totalEngagements || 0;
                document.getElementById('metric-scans').textContent = dashData.activeScans || 0;
                document.getElementById('metric-critical').textContent = dashData.criticalFindings || 0;
                document.getElementById('metric-high').textContent = dashData.highFindings || 0;
                document.getElementById('metric-resolved').textContent = dashData.resolvedFindings || 0;

                // Load activity feed
                const auditData = await api.getAuditLogs();
                loadActivityFeed(auditData);

                // Load engagements
                const engData = await api.listEngagements();
                loadEngagementsList(engData);
            } catch (err) {
                console.error('Error loading dashboard:', err);
                document.getElementById('activityFeed').innerHTML = `<p style="color: var(--error);">Failed to load activity</p>`;
                document.getElementById('engagementsList').innerHTML = `<p style="color: var(--error);">Failed to load engagements</p>`;
            }
        }

        function loadActivityFeed(data) {
            const feed = document.getElementById('activityFeed');
            
            if (!data.logs || data.logs.length === 0) {
                feed.innerHTML = '<p style="color: #999; padding: 1rem;">No activity yet</p>';
                return;
            }

            feed.innerHTML = data.logs.slice(0, 10).map(log => `
                <div class="activity-item">
                    <div class="activity-text">
                        <strong>${log.user || 'System'}</strong> ${log.action}
                        <br><small style="color: #999;">${log.resource || ''}</small>
                    </div>
                    <div class="activity-time">${formatTimeAgo(log.createdAt)}</div>
                </div>
            `).join('');
        }

        function loadEngagementsList(data) {
            const list = document.getElementById('engagementsList');
            
            if (!data.engagements || data.engagements.length === 0) {
                list.innerHTML = '<p style="color: #999; padding: 1rem;">No engagements yet</p>';
                return;
            }

            list.innerHTML = data.engagements.map(eng => `
                <div class="activity-item">
                    <div class="activity-text">
                        <strong>${eng.name || eng.id}</strong>
                        <br><small style="color: #999;">Client: ${eng.clientName || 'Unknown'}</small>
                    </div>
                    <div style="text-align: right;">
                        <div style="margin-bottom: 0.5rem;">
                            <span class="severity-badge ${eng.status}">
                                ${eng.status || 'pending'}
                            </span>
                        </div>
                        <div class="activity-time">${eng.createdAt ? formatDate(eng.createdAt) : 'N/A'}</div>
                    </div>
                </div>
            `).join('');
        }

        // Initialize on page load
        if (auth.isLoggedIn()) {
            initPage();
        } else {
            window.location.href = '/html/login.html';
        }
    </script>
</body>
</html>
