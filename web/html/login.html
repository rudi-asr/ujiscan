<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ujiscan - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e27;
            --fg: #e0e0e0;
            --bg-secondary: #1a1f3a;
            --border: #333;
            --accent: #00d4ff;
            --success: #00ff88;
            --error: #ff3333;
        }

        html[data-theme="dark"] {
            --bg: #0a0e27;
            --fg: #e0e0e0;
            --bg-secondary: #1a1f3a;
            --border: #333;
            --accent: #00d4ff;
            --success: #00ff88;
            --error: #ff3333;
        }

        html[data-theme="light"] {
            --bg: #ffffff;
            --fg: #000000;
            --bg-secondary: #f5f5f5;
            --border: #cccccc;
            --accent: #0066ff;
            --success: #00aa00;
            --error: #cc0000;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .login-header p {
            color: #999;
            margin: 0;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--fg);
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--bg);
            color: var(--fg);
            font-size: 1em;
            box-sizing: border-box;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            background-color: #00b8d4;
            transform: translateY(-2px);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error);
            font-size: 0.9em;
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(255, 51, 51, 0.1);
            border-radius: 4px;
            display: none;
        }

        .success-message {
            color: var(--success);
            font-size: 0.9em;
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(0, 255, 136, 0.1);
            border-radius: 4px;
            display: none;
        }

        .demo-credentials {
            background-color: rgba(0, 212, 255, 0.05);
            border-left: 3px solid var(--accent);
            padding: 12px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 0.85em;
            line-height: 1.5;
        }

        .demo-credentials strong {
            color: var(--accent);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5em;
            color: var(--fg);
        }

        .theme-toggle:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="theme.toggle()" title="Toggle theme">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>☠️</h1>
                <h1>ujiscan</h1>
                <p>Agentic Penetration Testing Platform</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@ujiscan.local"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <button type="submit" class="login-button" id="loginButton">
                    Sign In
                </button>
            </form>

            <div class="demo-credentials">
                <strong>Demo Credentials:</strong><br>
                Email: <code>admin@ujiscan.local</code><br>
                Password: <code>admin123</code>
            </div>
        </div>
    </div>

    <script src="../app.js"></script>
    <script>
        // Update theme icon
        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            icon.textContent = theme.current() === 'dark' ? '☀️' : '🌙';
        }

        // Page initialization
        function initPage() {
            updateThemeIcon();

            // Watch for theme changes
            const observer = new MutationObserver(updateThemeIcon);
            observer.observe(document.documentElement, { attributes: true });

            // Handle login form
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const button = document.getElementById('loginButton');
                const errorDiv = document.getElementById('errorMessage');
                const successDiv = document.getElementById('successMessage');

                button.disabled = true;
                button.textContent = 'Signing in...';
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';

                const success = await auth.login(email, password);

                if (success) {
                    successDiv.textContent = 'Login successful! Redirecting...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/html/dashboard-team.html';
                    }, 1000);
                } else {
                    errorDiv.textContent = 'Invalid email or password';
                    errorDiv.style.display = 'block';
                    button.disabled = false;
                    button.textContent = 'Sign In';
                }
            });
        }

        // Initialize if not logged in
        if (!auth.isLoggedIn()) {
            initPage();
        } else {
            window.location.href = '/html/dashboard-team.html';
        }
    </script>
</body>
</html>
