workflows:
  regular_scan:
    name: "regular_scan"
    description: "Regular comprehensive security scan with standard tools"
    version: "1.0"
    timeout: 7200
    playbook: "regular-scan"
    steps:
      - id: "dns_recon"
        name: "DNS Reconnaissance"
        tool: "dig"
        parameters:
          target: "{{ Target }}"
          args: ""
        timeout: 60
        
      - id: "subdomain_enum"
        name: "Subdomain Enumeration"
        tool: "subfinder"
        parameters:
          target: "{{ Target }}"
          args: "-json"
        timeout: 300
        
      - id: "port_scan"
        name: "Port Scanning"
        tool: "nmap"
        parameters:
          target: "{{ Target }}"
          args: "-p 22,80,443,3306,5432,6379,27017,8080,8443,8000,5000,3000 -sV -sC"
        timeout: 600
        
      - id: "http_probe"
        name: "HTTP Probing"
        tool: "httpx"
        parameters:
          target: "{{ Target }}"
          args: "-json"
        timeout: 300
        
      - id: "web_fingerprint"
        name: "Web Technology Fingerprinting"
        tool: "whatweb"
        parameters:
          target: "{{ Target }}"
          args: "--color=never --log-json=-"
        timeout: 300
        
      - id: "ssl_audit"
        name: "SSL/TLS Audit"
        tool: "sslscan"
        parameters:
          target: "{{ Target }}"
          args: "--no-failed"
        timeout: 300
        
      - id: "vuln_scan"
        name: "Vulnerability Scanning"
        tool: "nuclei"
        parameters:
          target: "{{ Target }}"
          args: "-json -severity high,critical"
        timeout: 600
        
      - id: "dir_brute"
        name: "Directory Brute-Force"
        tool: "gobuster"
        parameters:
          target: "{{ Target }}"
          args: "dir -u http://{{ Target }} -w /usr/share/wordlists/dirbuster/directory-list-2.3-small.txt -q"
        timeout: 600
        
      - id: "web_server_scan"
        name: "Web Server Vulnerability Scan"
        tool: "nikto"
        parameters:
          target: "{{ Target }}"
          args: "-Format JSON"
        timeout: 300

  quick_scan:
    name: "quick_scan"
    description: "Ultra-fast security scan with nmap only"
    version: "1.0"
    timeout: 600
    playbook: "quick-scan"
    steps:
      - id: "nmap_quick"
        name: "Quick Port Scan"
        tool: "nmap"
        parameters:
          target: "{{ Target }}"
          args: "-p 22,80,443,8080 -sV --open"
        timeout: 300

  full_scan_ai:
    name: "full_scan_ai"
    description: "AI Agent-driven comprehensive assessment"
    version: "1.0"
    timeout: 14400
    playbook: "full-scan-ai"
    mode: "agentic"
    steps:
      - id: "ai_recon"
        name: "AI Reconnaissance Planning"
        type: "ai-agent"
        parameters:
          target: "{{ Target }}"
          agent: "ReconAgent"
          autonomy: "full"
        timeout: 600
        
      - id: "ai_enum"
        name: "AI Service Enumeration"
        type: "ai-agent"
        parameters:
          target: "{{ Target }}"
          agent: "EnumAgent"
          autonomy: "full"
        timeout: 1200
        
      - id: "ai_vuln"
        name: "AI Vulnerability Assessment"
        type: "ai-agent"
        parameters:
          target: "{{ Target }}"
          agent: "VulnAgent"
          autonomy: "full"
        timeout: 1800
        
      - id: "ai_exploit"
        name: "AI Exploitation Planning"
        type: "ai-agent"
        parameters:
          target: "{{ Target }}"
          agent: "ExploitAgent"
          autonomy: "supervised"
        timeout: 900
        
      - id: "ai_report"
        name: "AI Report Generation"
        type: "ai-agent"
        parameters:
          target: "{{ Target }}"
          agent: "ReportAgent"
          autonomy: "full"
        timeout: 600

  web_standard:
    name: "web_standard"
    description: "Standard web application penetration test workflow"
    version: "1.0"
    timeout: 3600
    steps:
      - id: "recon_nmap"
        name: "Network Reconnaissance with nmap"
        tool: "nmap"
        parameters:
          target: "{{ Target }}"
          args: "-sV -sC --open"
        timeout: 300
        max_retries: 2
        capture: "nmap_results"
      
      - id: "scan_nuclei"
        name: "Vulnerability Scanning with nuclei"
        tool: "nuclei"
        parameters:
          target: "{{ Target }}"
          args: "-t cves -severity high,critical"
        timeout: 300
        max_retries: 1
        when: "nmap_results"
        capture: "nuclei_findings"
      
      - id: "analyze_findings"
        name: "AI Analysis of Findings"
        tool: "claude-analyzer"
        parameters:
          findings: "{{ nuclei_findings }}"
          target: "{{ Target }}"
        timeout: 180
        max_retries: 0
        capture: "analysis_result"

  network_deep:
    name: "network_deep"
    description: "Deep network reconnaissance and scanning"
    version: "1.0"
    timeout: 5400
    steps:
      - id: "nmap_network"
        name: "Network-wide scan"
        tool: "nmap"
        parameters:
          target: "{{ Target }}"
          args: "-sP -n"
        timeout: 600
        max_retries: 1
      
      - id: "masscan_fast"
        name: "Fast mass scanning"
        tool: "masscan"
        parameters:
          target: "{{ Target }}"
          args: "-p0-65535 --rate=1000"
        timeout: 900
        max_retries: 1

  cloud_infra:
    name: "cloud_infra"
    description: "Cloud infrastructure assessment"
    version: "1.0"
    timeout: 3600
    steps:
      - id: "cloud_recon"
        name: "Cloud infrastructure discovery"
        tool: "cloud-scanner"
        parameters:
          target: "{{ Target }}"
          args: "--regions all"
        timeout: 300
        max_retries: 1
      
      - id: "config_audit"
        name: "Configuration audit"
        tool: "nuclei"
        parameters:
          target: "{{ Target }}"
          args: "-t cloud"
        timeout: 300

  aggressive_test:
    name: "aggressive_test"
    description: "Aggressive red-team style penetration test"
    version: "1.0"
    timeout: 7200
    steps:
      - id: "full_recon"
        name: "Full reconnaissance"
        tool: "nmap"
        parameters:
          target: "{{ Target }}"
          args: "-sV -sC -O -A --script all"
        timeout: 600
        max_retries: 2
      
      - id: "aggressive_scan"
        name: "Aggressive vulnerability scanning"
        tool: "nuclei"
        parameters:
          target: "{{ Target }}"
          args: "-t cves -severity critical,high"
        timeout: 600
      
      - id: "exploitation"
        name: "Exploitation attempts"
        tool: "metasploit"
        parameters:
          target: "{{ Target }}"
        timeout: 900
        max_retries: 1

  quick_scan:
    name: "quick_scan"
    description: "Quick priority finding scan"
    version: "1.0"
    timeout: 1800
    steps:
      - id: "quick_nuclei"
        name: "Quick vulnerability scan"
        tool: "nuclei"
        parameters:
          target: "{{ Target }}"
          args: "-t cves -severity critical"
        timeout: 300
        max_retries: 0
      
      - id: "quick_analysis"
        name: "Quick AI analysis"
        tool: "claude-analyzer"
        parameters:
          target: "{{ Target }}"
        timeout: 120
