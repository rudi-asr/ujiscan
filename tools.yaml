# ujiscan Tool Registry & Methodology
# Based on OWASP Web Security Testing Guide (WSTG) v4.2
# Reference: https://owasp.org/www-project-web-security-testing-guide/
#
# This is 100% original work based on public OWASP methodology
# Not derived from any proprietary code

schema_version: "1.0"
description: "Tool catalog for ujiscan - based on OWASP WSTG methodology"

# OWASP WSTG phases (https://owasp.org/www-project-web-security-testing-guide/v4.2/)
phases:
  - id: "information_gathering"
    order: 1
    name: "Information Gathering"
    description: "Passive reconnaissance - collect information without direct interaction"
    owasp_wstg: "WSTG-INFO"
    
  - id: "configuration_analysis"
    order: 2
    name: "Configuration and Deployment Management Testing"
    description: "Analyze server/app configuration and deployment"
    owasp_wstg: "WSTG-CONF"
    
  - id: "identification"
    order: 3
    name: "Identity Management Testing"
    description: "Test authentication and authorization mechanisms"
    owasp_wstg: "WSTG-IDNT"
    
  - id: "authentication"
    order: 4
    name: "Authentication Testing"
    description: "Test login, session management, password policies"
    owasp_wstg: "WSTG-ATHN"
    
  - id: "authorization"
    order: 5
    name: "Authorization Testing"
    description: "Test access controls and privilege escalation"
    owasp_wstg: "WSTG-AUTZ"
    
  - id: "session_management"
    order: 6
    name: "Session Management Testing"
    description: "Test session handling and timeout"
    owasp_wstg: "WSTG-SESS"
    
  - id: "input_validation"
    order: 7
    name: "Input Validation Testing"
    description: "Test input handling - injection, XSS, path traversal"
    owasp_wstg: "WSTG-INPV"
    
  - id: "business_logic"
    order: 8
    name: "Business Logic Testing"
    description: "Test business logic flaws and workflows"
    owasp_wstg: "WSTG-BUSL"
    
  - id: "client_side"
    order: 9
    name: "Client-side Testing"
    description: "Test DOM, JavaScript, client-side logic"
    owasp_wstg: "WSTG-CLNT"
    
  - id: "api_testing"
    order: 10
    name: "API Testing"
    description: "Test REST/GraphQL APIs"
    owasp_wstg: "WSTG-APIT"

# Tools organized by OWASP phase
tools:
  # Phase 1: Information Gathering
  - id: "whois"
    name: "whois"
    description: "Domain registration lookup"
    phase: "information_gathering"
    category: "osint"
    
    execution:
      command: "whois"
      args: "{target}"
      timeout: 10
      
    output:
      format: "text"
      
    installation:
      macos: "brew install whois"
      linux: "apt-get install whois"
      
    mode: 
      - "web"
      - "network"
      - "api"

  - id: "dig"
    name: "dig"
    description: "DNS queries and zone transfers"
    phase: "information_gathering"
    category: "dns"
    
    execution:
      command: "dig"
      args: "{target} ANY"
      timeout: 10
      
    output:
      format: "text"
      
    installation:
      macos: "brew install bind"
      linux: "apt-get install dnsutils"
      
    mode:
      - "web"
      - "network"

  # Phase 2: Configuration Analysis
  - id: "nmap"
    name: "nmap"
    description: "Network reconnaissance - port scanning and service detection"
    phase: "configuration_analysis"
    category: "network_scan"
    
    variants:
      quick:
        args: "-F -oX"  # Top 100 ports, XML output
        timeout: 20
        description: "Quick port scan"
        
      standard:
        args: "-sV -p 1-65535 -oX"  # All ports, version detection
        timeout: 120
        description: "Full port scan with service version"
    
    execution:
      default_variant: "quick"
      timeout: 20
      
    output:
      format: "xml"
      parser: "xml"
      
    installation:
      macos: "brew install nmap"
      linux: "apt-get install nmap"
      
    mode:
      - "network"
      - "web"
      - "api"
      
    reference:
      owasp: "WSTG-CONF-01"

  # Phase 7: Input Validation - Vulnerability Scanning
  - id: "nuclei"
    name: "nuclei"
    description: "Template-based vulnerability scanner"
    phase: "input_validation"
    category: "vulnerability_scan"
    
    execution:
      command: "nuclei"
      args: "-u {target} -jsonl"
      timeout: 30
      
    output:
      format: "jsonl"
      parser: "jsonl"
      
    installation:
      macos: "go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest"
      linux: "go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest"
      
    mode:
      - "web"
      - "api"
      
    reference:
      owasp: "WSTG-INPV-01 (SQL Injection), WSTG-INPV-02 (XSS)"

  # Phase 10: API Testing
  - id: "curl"
    name: "curl"
    description: "HTTP client for manual API testing and PoC"
    phase: "api_testing"
    category: "utility"
    
    execution:
      command: "curl"
      args: "{url}"
      timeout: 10
      
    output:
      format: "text"
      capture_headers: true
      
    mode:
      - "web"
      - "api"

# Engagement modes based on target type detection
engagement_modes:
  - id: "web-application"
    name: "Web Application Testing"
    description: "Full web app security testing"
    target_detection:
      - "is_url"
      - "has_http_port"
    
    execution_order:
      - phase: "information_gathering"
        tools: ["whois", "dig"]
        parallel: true
        
      - phase: "configuration_analysis"
        tools: ["nmap"]
        parallel: false
        
      - phase: "input_validation"
        tools: ["nuclei"]
        parallel: false
        
      - phase: "api_testing"
        tools: ["curl"]
        parallel: false
    
    reference:
      owasp: "OWASP Web Security Testing Guide v4.2"

  - id: "network-reconnaissance"
    name: "Network Reconnaissance"
    description: "Network-focused security testing"
    target_detection:
      - "is_ip"
      - "is_cidr"
      - "is_ip_range"
    
    execution_order:
      - phase: "information_gathering"
        tools: ["whois"]
        parallel: false
        
      - phase: "configuration_analysis"
        tools: ["nmap"]
        parallel: true  # Can parallelize network scans
        
    reference:
      owasp: "OWASP Testing Guide - Network Testing"

# Testing methodologies (from OWASP WSTG)
methodologies:
  - name: "SQL Injection Testing"
    owasp_id: "WSTG-INPV-05"
    description: "Test application for SQL injection vulnerabilities"
    tools: ["nuclei", "curl"]
    manual_steps:
      - "Identify database-backed queries"
      - "Inject single quote to detect backend"
      - "Test boolean-based blind SQLi"
      - "Test time-based blind SQLi"
      - "Test error-based SQLi"
      - "Use sqlmap for automated exploitation (if available)"
    
  - name: "Cross-Site Scripting Testing"
    owasp_id: "WSTG-INPV-01"
    description: "Test application for XSS vulnerabilities"
    tools: ["nuclei", "curl"]
    manual_steps:
      - "Identify input points (URL params, forms, headers)"
      - "Inject <script>alert('xss')</script>"
      - "Test DOM-based XSS"
      - "Test stored XSS in database"
      - "Test reflected XSS in output"
      - "Use dalfox or xsstrike for semi-automated testing"
    
  - name: "Authentication Testing"
    owasp_id: "WSTG-ATHN"
    description: "Test authentication mechanisms"
    tools: ["curl", "nuclei"]
    manual_steps:
      - "Test default credentials"
      - "Test weak passwords"
      - "Test account lockout behavior"
      - "Test password recovery"
      - "Test multi-factor authentication bypass"
      - "Test session fixation"

# Scope validation (based on PTES - Penetration Testing Execution Standard)
scope_rules:
  - pattern: "{domain}"
    description: "Test exact domain only"
    example: "example.com"
    
  - pattern: "*.{domain}"
    description: "Test domain and all subdomains"
    example: "*.example.com"
    
  - pattern: "{cidr}"
    description: "Test network range"
    example: "192.168.1.0/24"

# Finding severity ratings (using CVSS v3.1 base)
severity_levels:
  - id: "critical"
    cvss_range: "9.0-10.0"
    description: "Immediate risk to system or data"
    
  - id: "high"
    cvss_range: "7.0-8.9"
    description: "Significant vulnerability requiring urgent fix"
    
  - id: "medium"
    cvss_range: "4.0-6.9"
    description: "Moderate risk"
    
  - id: "low"
    cvss_range: "0.1-3.9"
    description: "Minor issue"
    
  - id: "info"
    cvss_range: "0.0"
    description: "Informational finding"
