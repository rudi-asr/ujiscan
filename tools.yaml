# ujiscan Tool Registry & Methodology
# Based on OWASP Web Security Testing Guide (WSTG) v4.2
# Reference: https://owasp.org/www-project-web-security-testing-guide/
#
# This is 100% original work based on public OWASP methodology
# Not derived from any proprietary code

schema_version: "1.0"
description: "Tool catalog for ujiscan - based on OWASP WSTG methodology"

# OWASP WSTG phases
phases:
  - id: "information_gathering"
    order: 1
    name: "Information Gathering"
    description: "Passive reconnaissance - collect information without direct interaction"
    owasp_wstg: "WSTG-INFO"
    
  - id: "configuration_analysis"
    order: 2
    name: "Configuration and Deployment Management Testing"
    description: "Analyze server/app configuration and deployment"
    owasp_wstg: "WSTG-CONF"
    
  - id: "identification"
    order: 3
    name: "Identity Management Testing"
    description: "Test authentication and authorization mechanisms"
    owasp_wstg: "WSTG-IDNT"

# Tools organized by OWASP phase
tools:
  # Phase 1: Information Gathering
  - id: "whois"
    name: "whois"
    description: "Domain registration and ownership lookup"
    phase: "information_gathering"
    category: "osint"
    tags: ["domain", "passive", "info-gathering"]
    mode_applicability: ["reconnaissance", "bug-bounty", "red-team"]
    target_types: ["domain", "ip"]
    command:
      command: "whois"
      args: "{target}"
      timeout: 10
    execution:
      command: "whois"
      args: "{target}"
      timeout_seconds: 10
      timeout_behavior: "kill"
      require_root: false
    installation:
      check_command: "whois --version"
      check_exit_code: 0
      macos: "brew install whois"
      linux: "apt-get install whois"
      windows: "choco install whois"
    output:
      format: "text"
      stderr_on_failure: true
    reference:
      owasp: "WSTG-INFO-04"
      technique: "Whois lookup"

  - id: "dig"
    name: "dig"
    description: "DNS enumeration and lookup tool"
    phase: "information_gathering"
    category: "dns"
    tags: ["dns", "passive", "enumeration"]
    mode_applicability: ["reconnaissance", "bug-bounty", "red-team"]
    target_types: ["domain"]
    command:
      command: "dig"
      args: "{target} ANY"
      timeout: 10
    execution:
      command: "dig"
      args: "{target} ANY"
      timeout_seconds: 10
      timeout_behavior: "kill"
      require_root: false
    installation:
      check_command: "dig -v"
      check_exit_code: 0
      macos: "brew install bind"
      linux: "apt-get install dnsutils"
      windows: "choco install bind-toolsonly"
    output:
      format: "text"
      stderr_on_failure: true
    reference:
      owasp: "WSTG-INFO-05"
      technique: "DNS enumeration"

  - id: "nmap"
    name: "nmap"
    description: "Network mapper - port scanning and service detection"
    phase: "configuration_analysis"
    category: "network"
    tags: ["port-scan", "service-detect", "network-recon"]
    mode_applicability: ["reconnaissance", "red-team", "network-scan"]
    target_types: ["ip", "ip_range", "cidr", "domain"]
    variants:
      quick:
        description: "Fast scan - top 100 ports"
        command_args: ["-F"]
        timeout_seconds: 30
      full:
        description: "Full scan - all ports"
        command_args: ["-p-"]
        timeout_seconds: 120
      aggressive:
        description: "Aggressive scan with scripts"
        command_args: ["-A", "-T4"]
        timeout_seconds: 120
    command:
      command: "nmap"
      args: "-F -oX {output} {target}"
      timeout: 30
    execution:
      command: "nmap"
      args: "-F -oX {output} {target}"
      timeout_seconds: 30
      timeout_behavior: "kill"
      require_root: false
      default_variant: "quick"
    installation:
      check_command: "nmap --version"
      check_exit_code: 0
      macos: "brew install nmap"
      linux: "apt-get install nmap"
      windows: "choco install nmap"
    output:
      format: "xml"
      parser: "nmap_xml"
      stderr_on_failure: true
    reference:
      owasp: "WSTG-INFO-06"
      technique: "Network scanning"

  - id: "nuclei"
    name: "nuclei"
    description: "Template-based vulnerability scanner"
    phase: "identification"
    category: "vulnerability"
    tags: ["vuln-scan", "template-based", "fast"]
    mode_applicability: ["hunt", "bug-bounty", "red-team"]
    target_types: ["url", "domain"]
    variants:
      quick:
        description: "Quick scan - common templates"
        command_args: ["-t", "http/misconfiguration"]
        timeout_seconds: 60
      full:
        description: "Full template suite"
        command_args: []
        timeout_seconds: 300
    command:
      command: "nuclei"
      args: "-u {target} -jsonl"
      timeout: 60
    execution:
      command: "nuclei"
      args: "-u {target} -jsonl"
      timeout_seconds: 60
      timeout_behavior: "kill"
      require_root: false
      default_variant: "quick"
    installation:
      check_command: "nuclei -version"
      check_exit_code: 0
      macos: "brew install nuclei"
      linux: "apt-get install nuclei"
      windows: "choco install nuclei"
    output:
      format: "jsonl"
      parser: "nuclei_jsonl"
      stderr_on_failure: true
    reference:
      owasp: "WSTG-APIT-01"
      technique: "Vulnerability scanning"

  - id: "curl"
    name: "curl"
    description: "HTTP client for web probing and header analysis"
    phase: "configuration_analysis"
    category: "http"
    tags: ["http", "headers", "web-probe"]
    mode_applicability: ["reconnaissance", "hunt", "bug-bounty"]
    target_types: ["url"]
    command:
      command: "curl"
      args: "-i -v {target}"
      timeout: 10
    execution:
      command: "curl"
      args: "-i -v {target}"
      timeout_seconds: 10
      timeout_behavior: "kill"
      require_root: false
    installation:
      check_command: "curl --version"
      check_exit_code: 0
      macos: "brew install curl"
      linux: "apt-get install curl"
      windows: "choco install curl"
    output:
      format: "text"
      capture_headers: true
      stderr_on_failure: true
    reference:
      owasp: "WSTG-INFO-09"
      technique: "HTTP header analysis"

# Engagement modes - automation orchestration
modes:
  - id: "reconnaissance"
    name: "Reconnaissance"
    description: "Passive information gathering and network discovery"
    target_detection: ["domain", "ip", "url"]
    parallel_enabled: true
    execution_order:
      - phase: "information_gathering"
        tools: ["whois", "dig"]
        parallel: true
      - phase: "configuration_analysis"
        tools: ["nmap", "curl"]
        parallel: true
    reference:
      owasp: "WSTG-INFO"
      methodology: "OSINT-first approach"

  - id: "hunt"
    name: "Vulnerability Hunt"
    description: "Active vulnerability scanning and enumeration"
    target_detection: ["url", "domain"]
    parallel_enabled: true
    execution_order:
      - phase: "information_gathering"
        tools: ["whois", "dig"]
        parallel: true
      - phase: "configuration_analysis"
        tools: ["nmap", "curl"]
        parallel: true
      - phase: "identification"
        tools: ["nuclei"]
        parallel: false
    reference:
      owasp: "WSTG"
      methodology: "Template-based vulnerability detection"

  - id: "red-team"
    name: "Red Team Assessment"
    description: "Full adversarial evaluation (recon -> hunt -> verify)"
    target_detection: ["domain", "ip", "url"]
    parallel_enabled: false
    execution_order:
      - phase: "information_gathering"
        tools: ["whois", "dig"]
        parallel: true
      - phase: "configuration_analysis"
        tools: ["nmap", "curl"]
        parallel: false
      - phase: "identification"
        tools: ["nuclei"]
        parallel: false
    reference:
      owasp: "WSTG"
      methodology: "Full pentest workflow"

  - id: "network-scan"
    name: "Network Scanning"
    description: "Network-only reconnaissance (no web app testing)"
    target_detection: ["ip", "ip_range", "cidr"]
    parallel_enabled: true
    execution_order:
      - phase: "configuration_analysis"
        tools: ["nmap"]
        parallel: false
    reference:
      methodology: "Network discovery and mapping"

# Engagement types for reporting
engagement_types:
  - id: "bug-bounty"
    name: "Bug Bounty"
    description: "Bug bounty program assessment"
    report_format: "json"
    scope_required: true
    verification_required: true
    cvss_scoring: true

  - id: "red-team"
    name: "Red Team"
    description: "Authorized red team exercise"
    report_format: "markdown"
    scope_required: true
    verification_required: false
    cvss_scoring: false

  - id: "ctf"
    name: "Capture The Flag"
    description: "CTF competition scoring"
    report_format: "json"
    scope_required: false
    verification_required: false
    cvss_scoring: false

  - id: "exploration"
    name: "Exploration"
    description: "Learning and exploration mode"
    report_format: "text"
    scope_required: false
    verification_required: false
    cvss_scoring: false

# Severity levels mapped to CVSS
severity_levels:
  - id: "info"
    cvss_range: "0.0-0.0"
    description: "Informational findings"

  - id: "low"
    cvss_range: "0.1-3.9"
    description: "Low severity vulnerabilities"

  - id: "medium"
    cvss_range: "4.0-6.9"
    description: "Medium severity vulnerabilities"

  - id: "high"
    cvss_range: "7.0-8.9"
    description: "High severity vulnerabilities"

  - id: "critical"
    cvss_range: "9.0-10.0"
    description: "Critical severity vulnerabilities"

# Scope patterns for validation
scope_patterns:
  - pattern: "*.example.com"
    description: "Subdomains under example.com"
    example: "api.example.com"

  - pattern: "192.168.0.0/16"
    description: "Internal network range"
    example: "192.168.1.100"

  - pattern: "10.0.0.0/8"
    description: "Private network range"
    example: "10.0.0.5"
