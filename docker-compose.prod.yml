version: '3.8'

services:
  ujiscan:
    image: ujiscan:latest
    container_name: ujiscan-prod
    restart: always
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=info
      - DATABASE_PATH=/app/data/ujiscan.db
      - CORS_ALLOWED_ORIGINS=http://localhost:8081,http://localhost:3000,https://rudi-asr.github.io
    volumes:
      - ujiscan_prod_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  ujiscan_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/ujiscan/data

networks:
  default:
    name: ujiscan-network
